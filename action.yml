name: "Baseliner Assessment"
description: "Scan a fleet of repositories against a configurable baseline policy."
author: "baselinerhq"
branding:
  icon: "check-square"
  color: "green"

inputs:
  version:
    description: "baseliner version to install (e.g. v0.2.6, or 'latest')."
    default: "v0.2.6"
  config:
    description: "Path to the baseliner config file."
    default: "baseliner.yaml"
  format:
    description: "Output format: json, table, or both."
    default: "both"
  output-file:
    description: "Write JSON results to this file (optional)."
    default: ""
  sarif-file:
    description: "Write SARIF 2.1.0 to this file (optional; upload it to code scanning)."
    default: ""
  fail-under:
    description: "Exit 1 if any repo scores below this threshold, 0.0-1.0 (optional)."
    default: ""
  open-issues:
    description: "Open/update a findings issue per repo (true/false)."
    default: "false"
  public-context:
    description: >-
      Treat scan output as public, protecting private/internal repos per
      privacy.private_repos (default redact). Leave empty to auto-detect from
      this (the control) repo's visibility: enabled when public, disabled when
      private/internal. Set 'true'/'false' to override (case-insensitive);
      any other value fails the step.
    default: ""
  extra-args:
    description: "Additional arguments appended to `baseliner scan` (optional)."
    default: ""
  working-directory:
    description: "Directory to run the scan from."
    default: "."
  github-token:
    description: "Token used for GitHub scanning and --open-issues (and to authenticate the install when version=latest). The default reaches only this repo; pass a PAT or App token for a fleet scan."
    default: ${{ github.token }}
  api-url:
    description: >-
      GitHub API root for the scan (e.g. https://api.github.com). Leave empty to
      use the runner's GITHUB_API_URL. Set it to scan a github.com org from a
      GitHub Enterprise Server runner — Actions won't let `env:` override
      GITHUB_API_URL, so this input is the way to change it.
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install baseliner
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: curl -fsSL https://raw.githubusercontent.com/baselinerhq/baseliner/main/scripts/install.sh | bash

    - name: Run baseliner
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        PUBLIC_CONTEXT_INPUT: ${{ inputs.public-context }}
        API_URL_INPUT: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        args=(scan --config "${{ inputs.config }}" --format "${{ inputs.format }}")
        [ -n "${{ inputs.output-file }}" ] && args+=(--output-file "${{ inputs.output-file }}")
        [ -n "${{ inputs.sarif-file }}" ] && args+=(--sarif-file "${{ inputs.sarif-file }}")
        [ -n "${{ inputs.fail-under }}" ] && args+=(--fail-under "${{ inputs.fail-under }}")
        [ "${{ inputs.open-issues }}" = "true" ] && args+=(--open-issues)

        # Privacy guard: protect private repos when this control repo is public.
        # Auto-detect from the repo's visibility unless overridden. Fail closed:
        # only a definitively private/internal repo disables the guard; public
        # or an undeterminable visibility (e.g. token lacks metadata read on a
        # scheduled run) enables it.
        if ! public=$("$GITHUB_ACTION_PATH/scripts/public-context.sh" "$PUBLIC_CONTEXT_INPUT"); then
          echo "$public" # the ::error:: line
          exit 1
        fi
        if [ -z "$public" ]; then
          vis=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null || true)
          if [ "$vis" = "private" ] || [ "$vis" = "internal" ]; then
            public=false
          else
            public=true
          fi
        fi
        [ "$public" = "true" ] && args+=(--public-context)

        # shellcheck disable=SC2206
        [ -n "${{ inputs.extra-args }}" ] && args+=(${{ inputs.extra-args }})

        # baseliner reads GITHUB_API_URL for its API root. Actions sets it and
        # won't let `env:` override it, so the api-url input is applied here —
        # after the gh visibility lookup above, and for baseliner only.
        [ -n "$API_URL_INPUT" ] && export GITHUB_API_URL="$API_URL_INPUT"
        "$HOME/.local/bin/baseliner" "${args[@]}"
