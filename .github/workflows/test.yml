name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a sample config
        run: |
          cat > baseliner.yaml <<'YAML'
          scope:
            local:
              paths: ["."]
          policy:
            base: default
          YAML

      # Use the action from this checkout. fail-under: 0 makes this a smoke test
      # of "install + scan run", independent of this repo's own compliance.
      - name: Run the baseliner action
        uses: ./
        with:
          config: baseliner.yaml
          format: table
          fail-under: "0"

      # api-url must reach baseliner. With open-issues on, baseliner builds its
      # GitHub client and rejects a non-absolute GITHUB_API_URL (exit 2). If the
      # input were dropped, the runner's https://api.github.com would be used
      # and the step would pass — so this step is expected to fail.
      - name: Run with an invalid api-url
        id: bad_api_url
        continue-on-error: true
        uses: ./
        with:
          config: baseliner.yaml
          format: table
          fail-under: "0"
          open-issues: "true"
          api-url: not-a-url

      - name: The invalid api-url must have failed the scan
        if: steps.bad_api_url.outcome != 'failure'
        run: |
          echo "api-url did not reach baseliner (step outcome: ${{ steps.bad_api_url.outcome }})"
          exit 1

      # The public-context parser, case by case: case and surrounding
      # whitespace are ignored, and anything else fails without leaving the
      # guard off. A newline in the value must not reach the log unescaped,
      # or it would start a new workflow command.
      - name: Parse public-context values
        run: |
          check() {
            local got rc=0
            got=$(scripts/public-context.sh "$1") || rc=$?
            if [ "$2" = "error" ]; then
              [ "$rc" -ne 0 ] || { echo "accepted '$1' as '$got'"; return 1; }
              [ "$(printf '%s\n' "$got" | wc -l)" -eq 1 ] || { echo "multi-line error for '$1'"; return 1; }
            else
              if [ "$rc" -ne 0 ] || [ "$got" != "$2" ]; then
                echo "'$1': got '$got' rc=$rc, want '$2'"
                return 1
              fi
            fi
          }
          check "true" true
          check "TRUE" true
          check " True " true
          check $'\ttrue\n' true
          check "false" false
          check "FALSE" false
          check "" ""
          check "   " ""
          check "yes" error
          check "1" error
          check "tr ue" error
          check "fal se" error
          check $'yes\n::warning::injected' error
          echo "all public-context cases passed"

      # Any value other than true/false/empty must fail, not leave the guard
      # off: before, "yes" silently skipped --public-context.
      - name: Run with an invalid public-context
        id: bad_public_context
        continue-on-error: true
        uses: ./
        with:
          config: baseliner.yaml
          format: table
          fail-under: "0"
          public-context: "yes"

      - name: The invalid public-context must have failed the step
        if: steps.bad_public_context.outcome != 'failure'
        run: |
          echo "public-context 'yes' was accepted (step outcome: ${{ steps.bad_public_context.outcome }})"
          exit 1

  # The installer verifies an archive's build provenance before installing it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest release
        run: BINDIR="$RUNNER_TEMP/latest" VERSION=latest scripts/install.sh

      # On GitHub Enterprise Server the runner's token belongs to that server,
      # so it must not be sent to github.com, and the install must still work.
      # Set in the shell: Actions does not let `env:` override GITHUB_* values.
      - name: Install as a GHES runner would
        run: |
          GITHUB_SERVER_URL=https://ghes.invalid GITHUB_TOKEN=not-a-github-com-token \
            BINDIR="$RUNNER_TEMP/ghes" VERSION=v0.4.0 scripts/install.sh

      # The v0.4.0 archive has a real attestation, so these reach gh's
      # cryptographic check: only the right workflow and tag may pass it.
      - name: Verify provenance against workflow and tag
        run: |
          curl -fsSL -o "$RUNNER_TEMP/b.tar.gz" \
            https://github.com/baselinerhq/baseliner/releases/download/v0.4.0/baseliner_linux_amd64.tar.gz
          scripts/verify-provenance.sh "$RUNNER_TEMP/b.tar.gz" v0.4.0 .github/workflows/release.yml
          refuse() {
            local out
            if out=$(scripts/verify-provenance.sh "$RUNNER_TEMP/b.tar.gz" "$1" "$2" 2>&1); then
              echo "accepted tag $1, workflow $2"; return 1
            fi
            grep -q "is not attested as built by" <<<"$out" || { echo "$out"; echo "refused for another reason"; return 1; }
          }
          refuse v0.3.0 .github/workflows/release.yml
          refuse v0.4.0 .github/workflows/ci.yml
          echo "provenance checks passed"

      # v0.2.8 matches its checksums.txt but has no attestation.
      - name: Refuse a release without build provenance
        run: |
          set +e
          out=$(BINDIR="$RUNNER_TEMP/old" VERSION=v0.2.8 scripts/install.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "v0.2.8 was installed"; exit 1; }
          [ ! -e "$RUNNER_TEMP/old/baseliner" ] || { echo "a binary was left behind"; exit 1; }
          grep -q "build provenance" <<<"$out" || { echo "refused for another reason"; exit 1; }

      - name: Refuse a malformed version
        run: |
          set +e
          out=$(VERSION='v0.4.0/../x' BINDIR="$RUNNER_TEMP/bad" scripts/install.sh 2>&1)
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "a malformed version was accepted"; exit 1; }
          grep -q "version must be vX.Y.Z" <<<"$out" || { echo "$out"; echo "refused for another reason"; exit 1; }

  # TEMPORARY: mutation sweep of verify-provenance.sh; reverted before merge.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sweep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/b.tar.gz" \
            https://github.com/baselinerhq/baseliner/releases/download/v0.4.0/baseliner_linux_amd64.tar.gz
          orig=scripts/verify-provenance.sh
          sweep() {
            local name=$1 expr=$2 m="$RUNNER_TEMP/m.sh"
            sed "$expr" "$orig" > "$m"; chmod +x "$m"
            if [ "$(sha256sum < "$m")" = "$(sha256sum < "$orig")" ]; then echo "BROKEN   $name"; return; fi
            local killed=0
            "$m" "$RUNNER_TEMP/b.tar.gz" v0.4.0 .github/workflows/release.yml >/dev/null 2>&1 || killed=1
            "$m" "$RUNNER_TEMP/b.tar.gz" v0.3.0 .github/workflows/release.yml >/dev/null 2>&1 && killed=1
            "$m" "$RUNNER_TEMP/b.tar.gz" v0.4.0 .github/workflows/ci.yml >/dev/null 2>&1 && killed=1
            [ "$killed" = 1 ] && echo "KILLED   $name" || echo "SURVIVED $name"
          }
          sweep "control (no-op)" 's/THIS DOES NOT EXIST/x/'
          sweep "drop --source-ref" '/--source-ref/d'
          sweep "drop --signer-workflow" '/--signer-workflow/d'
          sweep "skip gh verify" 's/^if ! env -u GH_TOKEN/if false \&\& env -u GH_TOKEN/'
          sweep "drop --deny-self-hosted-runners" 's/^  --deny-self-hosted-runners; then/  ; then/'
